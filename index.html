        timerEl.className = 'metric-value timer-main' + (statusLabel === 'Solved' && elapsedMs > 0 && !usedSolver ? ' timer-solved' : '');

        const busy = (mode !== 'idle') || (activeAnimation !== null) || (moveQueue.length > 0) || (dragState !== null);
        const solvedNow = isStateSolved(readLogicalStateFrom3D());
        scrambleBtn.disabled = busy;
        solveBtn.disabled = busy || solvedNow;
        undoBtn.disabled = busy || manualHistory.length === 0;
        resetBtn.disabled = false;
        learnNextMoveBtn.disabled = busy || solvedNow || learnPlan.length === 0;
        learnPlayPhaseBtn.disabled = busy || solvedNow || learnPlan.length === 0;
        for (const b of moveBtns) {
          b.disabled = mode === 'scrambling' || mode === 'solving';
        }
      }

      function detachPivotAndSnap() {
        const children = [...pivotGroup.children];
        for (const cubie of children) {
          cubeRoot.attach(cubie);
          snapCubieExact(cubie);
        }
        pivotGroup.rotation.set(0, 0, 0);
        pivotGroup.updateMatrixWorld();
      }

      function attachSliceToPivot(axis, layer) {
        pivotGroup.rotation.set(0, 0, 0);
        pivotGroup.updateMatrixWorld();
        for (const cubie of cubies) {
          const coord = axis === 'x' ? cubie.userData.gx : (axis === 'y' ? cubie.userData.gy : cubie.userData.gz);
          if (coord === layer) {
            pivotGroup.attach(cubie);
          }
        }
      }

      function checkSolvedTransition(wasManual) {
        const solved = isStateSolved(readLogicalStateFrom3D());
        if (solved) {
          if (timerRunning && wasManual && !usedSolver) {
            elapsedMs = performance.now() - timerStartMs;
            timerRunning = false;
            if (bestTimeMs === null || elapsedMs < bestTimeMs) {
              bestTimeMs = elapsedMs;
              try { localStorage.setItem('chronocube_best_ms', String(bestTimeMs)); } catch {}
            }
          } else {
            timerRunning = false;
          }
          armedForSolve = false;
          statusLabel = 'Solved';
          phaseLabel = usedSolver ? 'Algorithmic solve complete' : (elapsedMs > 0 ? 'Solve complete' : 'Ready to scramble');
          pulseTimeLeft = PULSE_DURATION;
          telemetryPanel.classList.add('solved-flash');
          setTimeout(() => telemetryPanel.classList.remove('solved-flash'), 1100);
        } else if (mode === 'idle') {
          statusLabel = armedForSolve ? 'Ready' : 'Solving';
          if (timerRunning) statusLabel = 'Solving';
        }
      }

      function startQueuedMove(item, overrideStartTime) {
        const def = MOVE_DEFS[item.move];
        const angle = (def.dir === 2 ? Math.PI : def.dir * (Math.PI / 2));
        attachSliceToPivot(def.axis, def.layer);
        lastNotation = item.move;
        if (item.phaseText) phaseLabel = item.phaseText;
        activeAnimation = {
          axis: def.axis,
          startAngle: 0,
          targetAngle: angle,
          startTime: overrideStartTime ?? performance.now(),
          duration: item.duration ?? animDurationMs,
          move: item.move,
          isManual: !!item.isManual,
          countMove: item.countMove !== false,
          onDone: item.onDone
        };
        if (item.isManual) {
          if (armedForSolve && !timerRunning) {
            timerStartMs = performance.now();
            timerRunning = true;
            elapsedMs = 0;
            statusLabel = 'Solving';
            phaseLabel = 'Manual speedsolve';
          } else if (!timerRunning && statusLabel === 'Solved') {
            statusLabel = 'Solving';
            phaseLabel = 'Free play';
          }
        }
        syncUI();
        ensureLoopRunning();
      }

      function enqueueMove(move, options = {}) {
        moveQueue.push({ move, ...options });
        if (!activeAnimation && !dragState) {
          startQueuedMove(moveQueue.shift());
        }
      }

      function handleManualMove(move, recordHistory = true) {
        if (mode === 'scrambling' || mode === 'solving' || dragState) return;
        if (recordHistory) {
          manualHistory.push(move);
          moveCounter++;
        }
        enqueueMove(move, {
          isManual: true,
          duration: animDurationMs,
          onDone: () => {
            checkSolvedTransition(true);
            handleLearnAfterManualMove(move, false);
            syncUI();
          }
        });
      }

      // -----------------------------------------------------------------------
      // Direct Raycast Slice Dragging vs OrbitControls
      // -----------------------------------------------------------------------
      const raycaster = new THREE.Raycaster();
      const pointerNDC = new THREE.Vector2();
      let dragState = null;

      function getCanvasCoords(clientX, clientY) {
        const rect = renderer.domElement.getBoundingClientRect();
        return {
          ndcX: ((clientX - rect.left) / rect.width) * 2 - 1,
          ndcY: -((clientY - rect.top) / rect.height) * 2 + 1,
          rect
        };
      }

      function projectWorldToScreen(worldPos, rect) {
        _v3.copy(worldPos).project(camera);
        return {
          x: ((_v3.x + 1) * 0.5) * rect.width + rect.left,
          y: ((-_v3.y + 1) * 0.5) * rect.height + rect.top
        };
      }

      function getTangentAxesForNormal(n) {
        if (Math.abs(n.x) > 0.5) return [new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 0, 1)];
        if (Math.abs(n.y) > 0.5) return [new THREE.Vector3(1, 0, 0), new THREE.Vector3(0, 0, 1)];
        return [new THREE.Vector3(1, 0, 0), new THREE.Vector3(0, 1, 0)];
      }

      function resolveSliceMoveName(axis, layer, dir) {
        // dir is +1 or -1 (90 deg step)
        for (const [name, def] of Object.entries(MOVE_DEFS)) {
          if (def.dir !== 2 && def.axis === axis && def.layer === layer && def.dir === dir) {
            return name;
          }
        }
        return null;
      }

      function onPointerDown(e) {
        if (e.button !== 0 && e.pointerType === 'mouse') return;
        if (mode !== 'idle' || activeAnimation || moveQueue.length > 0) return;

        const { ndcX, ndcY, rect } = getCanvasCoords(e.clientX, e.clientY);
        pointerNDC.set(ndcX, ndcY);
        raycaster.setFromCamera(pointerNDC, camera);
        const hits = raycaster.intersectObjects(raycastTargets, false);

        if (hits.length > 0) {
          const hit = hits[0];
          const cubie = hit.object.userData.cubie;
          if (!cubie || !hit.face) return;

          controls.enabled = false;
          const normalWorld = hit.face.normal.clone();
          _q.copy(hit.object.getWorldQuaternion(_q));
          normalWorld.applyQuaternion(_q);
          snapCardinalVector(normalWorld);

          dragState = {
            pointerId: e.pointerId,
            startX: e.clientX,
            startY: e.clientY,
            lastX: e.clientX,
            lastY: e.clientY,
            hitPoint: hit.point.clone(),
            normalWorld,
            cubie,
            rect,
            locked: false,
            axis: null,
            layer: 0,
            tangentScreenDir: null,
            signFactor: 1,
            currentAngle: 0,
            lastDragDelta: 0
          };
          renderer.domElement.setPointerCapture(e.pointerId);
        }
      }

      function onPointerMove(e) {
        if (!dragState || e.pointerId !== dragState.pointerId) return;

        const dx = e.clientX - dragState.startX;
        const dy = e.clientY - dragState.startY;
        dragState.lastDragDelta = (e.clientX - dragState.lastX) * (dragState.tangentScreenDir ? dragState.tangentScreenDir.x : 0) +
                                  (e.clientY - dragState.lastY) * (dragState.tangentScreenDir ? dragState.tangentScreenDir.y : 0);
        dragState.lastX = e.clientX;
        dragState.lastY = e.clientY;

        if (!dragState.locked) {
          const dist = Math.hypot(dx, dy);
          if (dist < 10) return;

          // Determine best matching tangent axis in screen space
          const [t1, t2] = getTangentAxesForNormal(dragState.normalWorld);
          const p0 = projectWorldToScreen(dragState.hitPoint, dragState.rect);
          const p1 = projectWorldToScreen(dragState.hitPoint.clone().add(t1), dragState.rect);
          const p2 = projectWorldToScreen(dragState.hitPoint.clone().add(t2), dragState.rect);

          const s1 = new THREE.Vector2(p1.x - p0.x, p1.y - p0.y);
          const s2 = new THREE.Vector2(p2.x - p0.x, p2.y - p0.y);
          if (s1.lengthSq() > 0.0001) s1.normalize();
          if (s2.lengthSq() > 0.0001) s2.normalize();

          const dragVec = new THREE.Vector2(dx, dy);
          const dot1 = dragVec.dot(s1);
          const dot2 = dragVec.dot(s2);

          const chosenTangent = Math.abs(dot1) >= Math.abs(dot2) ? t1 : t2;
          const chosenScreen = Math.abs(dot1) >= Math.abs(dot2) ? s1 : s2;

          // ω = N × M: moving along +chosenTangent on face +N rotates around cross(N, chosenTangent)
          const rotVec = new THREE.Vector3().crossVectors(dragState.normalWorld, chosenTangent);
          snapCardinalVector(rotVec);

          let axis = 'x';
          let signFactor = 1;
          if (Math.abs(rotVec.x) > 0.5) { axis = 'x'; signFactor = Math.sign(rotVec.x); }
          else if (Math.abs(rotVec.y) > 0.5) { axis = 'y'; signFactor = Math.sign(rotVec.y); }
          else { axis = 'z'; signFactor = Math.sign(rotVec.z); }

          const layer = axis === 'x' ? dragState.cubie.userData.gx :
                        (axis === 'y' ? dragState.cubie.userData.gy : dragState.cubie.userData.gz);

          dragState.locked = true;
          dragState.axis = axis;
          dragState.layer = layer;
          dragState.tangentScreenDir = chosenScreen;
          dragState.signFactor = signFactor;

          attachSliceToPivot(axis, layer);
        }

        if (dragState.locked) {
          const dragVec = new THREE.Vector2(dx, dy);
          const projPx = dragVec.dot(dragState.tangentScreenDir);
          const angle = (projPx / 120) * (Math.PI / 2) * dragState.signFactor;
          dragState.currentAngle = THREE.MathUtils.clamp(angle, -Math.PI * 0.68, Math.PI * 0.68);
          pivotGroup.rotation[dragState.axis] = dragState.currentAngle;
          requestRender();
        }
      }

      function onPointerUp(e) {
        if (!dragState || e.pointerId !== dragState.pointerId) return;
        try { renderer.domElement.releasePointerCapture(e.pointerId); } catch {}
        controls.enabled = true;

        const state = dragState;
        dragState = null;

        if (!state.locked) {
          syncUI();
          return;
        }

        const threshold = Math.PI / 10; // ~18 degrees
        let quarterSteps = 0;
        if (Math.abs(state.currentAngle) >= threshold) {
          quarterSteps = Math.sign(state.currentAngle);
        }

        const targetAngle = quarterSteps * (Math.PI / 2);
        const moveName = quarterSteps !== 0
          ? resolveSliceMoveName(state.axis, state.layer, quarterSteps)
          : null;

        if (moveName) {
          manualHistory.push(moveName);
          moveCounter++;
          lastNotation = moveName;
          if (armedForSolve && !timerRunning) {
            timerStartMs = performance.now();
            timerRunning = true;
            elapsedMs = 0;
            statusLabel = 'Solving';
            phaseLabel = 'Manual speedsolve';
          } else if (!timerRunning && statusLabel === 'Solved') {
            statusLabel = 'Solving';
            phaseLabel = 'Free play';
          }
        }

        const remainRatio = Math.abs(targetAngle - state.currentAngle) / (Math.PI / 2);
        const snapDur = Math.max(55, Math.min(animDurationMs, animDurationMs * Math.max(0.35, remainRatio)));

        activeAnimation = {
          axis: state.axis,
          startAngle: state.currentAngle,
          targetAngle,
          startTime: performance.now(),
          duration: snapDur,
          move: moveName,
          isManual: !!moveName,
          countMove: false,
          onDone: () => {
            if (moveName) {
              checkSolvedTransition(true);
              handleLearnAfterManualMove(moveName, false);
            }
            syncUI();
          }
        };
        syncUI();
        ensureLoopRunning();
      }

      renderer.domElement.addEventListener('pointerdown', onPointerDown);
      renderer.domElement.addEventListener('pointermove', onPointerMove);
      renderer.domElement.addEventListener('pointerup', onPointerUp);
      renderer.domElement.addEventListener('pointercancel', onPointerUp);

      // -----------------------------------------------------------------------
      // Button Actions & Keyboard Controls
      // -----------------------------------------------------------------------
      function resetCubeImmediate() {
        moveQueue.length = 0;
        activeAnimation = null;
        dragState = null;
        controls.enabled = true;
        detachPivotAndSnap();

        // Reset every cubie back to its original solved position & identity rotation
        let idx = 0;
        for (let x = -1; x <= 1; x++) {
          for (let y = -1; y <= 1; y++) {
            for (let z = -1; z <= 1; z++) {
              const c = cubies[idx++];
              c.position.set(x * SPACING, y * SPACING, z * SPACING);
              c.quaternion.identity();
              c.userData.gx = x;
              c.userData.gy = y;
              c.userData.gz = z;
            }
          }
        }

        mode = 'idle';
        learnPlayingPhase = false;
        manualHistory = [];
        moveCounter = 0;
        timerRunning = false;
        armedForSolve = false;
        usedSolver = false;
        elapsedMs = 0;
        statusLabel = 'Solved';
        phaseLabel = 'Ready to scramble';
        lastNotation = '—';
        pulseTimeLeft = 0;
        cubeRoot.scale.setScalar(1);
        if (learnOpen) refreshLearnPlan();
        else updateLearnHighlight();
        syncUI();
        requestRender();
      }

      scrambleBtn.addEventListener('click', () => {
        if (mode !== 'idle' || activeAnimation || moveQueue.length > 0 || dragState) return;
        const seq = generateScramble(22);
        mode = 'scrambling';
        learnPlayingPhase = false;
        manualHistory = [];
        moveCounter = 0;
        timerRunning = false;
        armedForSolve = false;
        usedSolver = false;
        elapsedMs = 0;
        statusLabel = 'Scrambling';
        phaseLabel = 'Applying 22 random moves';
        updateLearnHighlight();
        syncUI();

        const scrambleStepMs = Math.max(45, Math.min(animDurationMs, 95));
        seq.forEach((m, idx) => {
          enqueueMove(m, {
            duration: scrambleStepMs,
            isManual: false,
            phaseText: `Scrambling (${idx + 1}/${seq.length})`,
            onDone: idx === seq.length - 1 ? () => {
              mode = 'idle';
              armedForSolve = true;
              statusLabel = 'Ready';
              phaseLabel = 'Inspection — make first move';
              setLearnOpen(true);
              syncUI();
            } : undefined
          });
        });
      });

      solveBtn.addEventListener('click', () => {
        if (mode !== 'idle' || activeAnimation || moveQueue.length > 0 || dragState) return;
        const currentLogical = readLogicalStateFrom3D();
        if (isStateSolved(currentLogical)) return;

        const phases = solveCubeLBL(currentLogical);
        const flatSteps = [];
        for (const ph of phases) {
          for (const mv of ph.moves) {
            flatSteps.push({ mv, phaseName: ph.name });
          }
        }

        if (flatSteps.length === 0) return;

        mode = 'solving';
        learnPlayingPhase = false;
        usedSolver = true;
        timerRunning = false;
        armedForSolve = false;
        statusLabel = 'Solving';
        updateLearnHighlight();
        syncUI();

        flatSteps.forEach((step, idx) => {
          enqueueMove(step.mv, {
            duration: animDurationMs,
            isManual: false,
            phaseText: `Solving: ${step.phaseName}`,
            onDone: () => {
              moveCounter++;
              if (idx === flatSteps.length - 1) {
                mode = 'idle';
                checkSolvedTransition(false);
                if (learnOpen) refreshLearnPlan();
              }
              syncUI();
            }
          });
        });
      });

      learnBtn.addEventListener('click', () => {
        setLearnOpen(!learnOpen);
      });

      learnCloseBtn.addEventListener('click', () => {
        setLearnOpen(false);
      });

      learnNextMoveBtn.addEventListener('click', () => {
        if (!learnOpen || mode !== 'idle' || activeAnimation || moveQueue.length > 0 || dragState) return;
        if (learnPlan.length === 0) return;
        const curPhase = learnPlan[0];
        const curStep = curPhase.steps[learnStepIdx];
        if (!curStep || learnMoveIdx >= curStep.moves.length) return;

        const mv = curStep.moves[learnMoveIdx];
        usedSolver = true;
        timerRunning = false;
        armedForSolve = false;

        enqueueMove(mv, {
          duration: animDurationMs,
          isManual: false,
          phaseText: `Vodič: ${curPhase.titleSr}`,
          onDone: () => {
            moveCounter++;
            learnMoveIdx++;
            if (learnMoveIdx >= curStep.moves.length) {
              learnStepIdx++;
              learnMoveIdx = 0;
            }
            checkSolvedTransition(false);
            if (learnStepIdx >= curPhase.steps.length || isStateSolved(readLogicalStateFrom3D())) {
              refreshLearnPlan();
            } else {
              renderLearnPanel();
              updateLearnHighlight();
            }
            syncUI();
          }
        });
      });

      learnPlayPhaseBtn.addEventListener('click', () => {
        if (!learnOpen || mode !== 'idle' || activeAnimation || moveQueue.length > 0 || dragState) return;
        if (learnPlan.length === 0) return;
        const curPhase = learnPlan[0];
        const rem = [];
        for (let s = learnStepIdx; s < curPhase.steps.length; s++) {
          const startM = s === learnStepIdx ? learnMoveIdx : 0;
          for (let m = startM; m < curPhase.steps[s].moves.length; m++) {
            rem.push({ mv: curPhase.steps[s].moves[m], sIdx: s, mIdx: m });
          }
        }
        if (rem.length === 0) return;

        mode = 'solving';
        learnPlayingPhase = true;
        usedSolver = true;
        timerRunning = false;
        armedForSolve = false;
        statusLabel = 'Solving';
        syncUI();

        rem.forEach((item, idx) => {
          enqueueMove(item.mv, {
            duration: animDurationMs,
            isManual: false,
            phaseText: `Vodič: ${curPhase.titleSr}`,
            onDone: () => {
              moveCounter++;
              if (idx === rem.length - 1) {
                mode = 'idle';
                learnPlayingPhase = false;
                checkSolvedTransition(false);
                refreshLearnPlan();
              } else {
                const next = rem[idx + 1];
                learnStepIdx = next.sIdx;
                learnMoveIdx = next.mIdx;
                renderLearnPanel();
                updateLearnHighlight();
              }
              syncUI();
            }
          });
        });
      });

      undoBtn.addEventListener('click', () => {
        if (mode !== 'idle' || activeAnimation || moveQueue.length > 0 || dragState) return;
        if (manualHistory.length === 0) return;
        const last = manualHistory.pop();
        moveCounter = Math.max(0, moveCounter - 1);
        enqueueMove(invertMove(last), {
          isManual: true,
          duration: animDurationMs,
          onDone: () => {
            checkSolvedTransition(true);
            handleLearnAfterManualMove(null, true);
            syncUI();
          }
        });
      });

      resetBtn.addEventListener('click', resetCubeImmediate);

      speedSlider.addEventListener('input', (e) => {
        animDurationMs = Number(e.target.value);
        speedValueEl.textContent = animDurationMs + 'ms';
      });

      for (const btn of moveBtns) {
        btn.addEventListener('click', () => {
          handleManualMove(btn.dataset.move, true);
        });
      }

      dockToggle.addEventListener('click', () => {
        const collapsed = dockWrapper.classList.toggle('collapsed');
        dockToggle.setAttribute('aria-expanded', String(!collapsed));
        dockToggle.textContent = collapsed ? 'Show Controls' : 'Hide Controls';
      });

      window.addEventListener('keydown', (e) => {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        const key = e.key.toUpperCase();
        if (key === 'H') {
          dockToggle.click();
          return;
        }
        if (key === 'Z' && !e.ctrlKey && !e.metaKey) {
          undoBtn.click();
          return;
        }
        if (OUTER_FACES.includes(key)) {
          e.preventDefault();
          const mv = e.shiftKey ? key + "'" : key;
          handleManualMove(mv, true);
        }
      });

      // -----------------------------------------------------------------------
      // Render Loop (On-Demand when Idle, Software-WebGL afterDraw Pacing)
      // -----------------------------------------------------------------------
      let frameId = 0;
      let loopRunning = false;
      let renderBusy = false;
      let renderDirty = false;
      let lastFrameTime = performance.now();

      function afterDraw(cb) {
        const gl = renderer.getContext();
        const sync = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        gl.flush();
        const poll = () => {
          const state = sync && gl.getSyncParameter(sync, gl.SYNC_STATUS);
          if (state === gl.UNSIGNALED) {
            frameId = window.setTimeout(poll, 5);
          } else {
            if (sync) gl.deleteSync(sync);
            frameId = window.setTimeout(cb, 80);
          }
        };
        frameId = window.setTimeout(poll, 5);
      }

      function stepScene(now) {
        const dt = Math.min(0.05, (now - lastFrameTime) / 1000);
        lastFrameTime = now;

        // 1. Update slice rotation animation (with bounded wall-clock catch-up for slow software renderers)
        let catchupSteps = 0;
        while (activeAnimation && catchupSteps < 5) {
          const elapsed = now - activeAnimation.startTime;
          const dur = Math.max(1, activeAnimation.duration);
          const t = Math.min(1, elapsed / dur);
          const eased = 1 - Math.pow(1 - t, 3);
          const angle = activeAnimation.startAngle + (activeAnimation.targetAngle - activeAnimation.startAngle) * eased;
          pivotGroup.rotation[activeAnimation.axis] = angle;

          if (t >= 1) {
            const finishTime = activeAnimation.startTime + dur;
            pivotGroup.rotation[activeAnimation.axis] = activeAnimation.targetAngle;
            detachPivotAndSnap();
            const finished = activeAnimation;
            activeAnimation = null;
            if (finished.onDone) finished.onDone();
            if (moveQueue.length > 0) {
              catchupSteps++;
              const nextStart = catchupSteps >= 5 ? now : finishTime;
              startQueuedMove(moveQueue.shift(), nextStart);
            }
          } else {
            break;
          }
        }

        // 2. Update speedcube timer display
        if (timerRunning) {
          timerEl.textContent = formatTime(now - timerStartMs);
        }

        // 3. Update solved celebration pulse
        if (pulseTimeLeft > 0) {
          pulseTimeLeft = Math.max(0, pulseTimeLeft - dt);
          const p = 1 - pulseTimeLeft / PULSE_DURATION;
          const wave = Math.sin(p * Math.PI);
          cubeRoot.scale.setScalar(1 + wave * 0.045);
          for (const [code, mat] of Object.entries(stickerMats)) {
            mat.emissiveIntensity = (code === 'W' ? 0.08 : 0) + wave * 0.25;
          }
          whiteCenterMat.emissiveIntensity = 0.08 + wave * 0.2;
          if (pulseTimeLeft === 0) {
            cubeRoot.scale.setScalar(1);
            for (const [code, mat] of Object.entries(stickerMats)) {
              mat.emissiveIntensity = code === 'W' ? 0.08 : 0;
            }
            whiteCenterMat.emissiveIntensity = 0.08;
          }
        }

        controls.update();
      }

      function needsContinuousLoop() {
        return activeAnimation !== null || moveQueue.length > 0 || timerRunning || pulseTimeLeft > 0;
      }

      function tick() {
        const now = performance.now();
        stepScene(now);
        renderer.render(scene, camera);

        if (needsContinuousLoop()) {
          if (isSoftwareGl) afterDraw(tick);
          else frameId = requestAnimationFrame(tick);
        } else {
          loopRunning = false;
        }
      }

      function ensureLoopRunning() {
        if (loopRunning) return;
        loopRunning = true;
        lastFrameTime = performance.now();
        if (isSoftwareGl) {
          frameId = requestAnimationFrame(tick);
        } else {
          frameId = requestAnimationFrame(tick);
        }
      }

      function requestRender() {
        if (loopRunning) return;
        if (renderBusy) {
          renderDirty = true;
          return;
        }
        renderBusy = true;
        frameId = requestAnimationFrame(() => {
          renderDirty = false;
          controls.update();
          renderer.render(scene, camera);
          const done = () => {
            renderBusy = false;
            if (renderDirty) requestRender();
          };
          if (isSoftwareGl) afterDraw(done);
          else done();
        });
      }

      controls.addEventListener('change', () => {
        requestRender();
      });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        updateCameraFraming(true);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(isSoftwareGl ? 1 : Math.min(window.devicePixelRatio, 2));
        requestRender();
      });

      // Expose state inspector for automated verification
      window.__CHRONOCUBE_DEBUG__ = {
        getState: () => ({
          status: statusLabel,
          phase: phaseLabel,
          moves: moveCounter,
          solved: isStateSolved(readLogicalStateFrom3D()),
          cubieCount: cubies.length,
          bestTimeMs,
          timerRunning,
          learnOpen,
          learnPhaseCount: learnPlan.length,
          learnActivePhase: learnPlan[0]?.name || null,
          learnStepIdx,
          learnMoveIdx,
          highlightVisible: highlightCage.visible
        })
      };

      if (!isSoftwareGl) {
        renderer.compile(scene, camera);
      }
      syncUI();
      requestRender();
    </script>
  </body>
</html>
